<!DOCTYPE html>

    <title>CAMB3 Pro - Neo Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1', 
                            600: '#4f46e5',
                            glow: '#818cf8',
                        }
                    }
                }
            }
        }

    <style>
        body {
            background: #f0f2f5;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .dark body {
            background: #0b0f1a;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.1) 0px, transparent 50%);
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .dark .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .schedule-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .active-glow {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .active-glow::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #6366f1, #10b981);
            z-index: -1;
            border-radius: 1.5rem;
            opacity: 0.5;
            filter: blur(8px);
            animation: pulse-glow 3s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }

        .custom-scroll::-webkit-scrollbar, .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .day-tab.active {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="text-slate-700 dark:text-slate-200 min-h-screen transition-colors duration-500 selection:bg-brand-500/30">

        </nav>

        <div class="p-6 border-t border-slate-200/50 dark:border-slate-700/50 space-y-4">

            </button>
            <button onclick="openBackupModal()" class="w-full flex items-center justify-center lg:justify-start text-emerald-500 font-black text-[10px] uppercase tracking-widest hover:opacity-80">
                <i class="fas fa-sync w-5"></i> <span class="hidden lg:block ml-2">Sincronizar</span>
            </button>
            <button onclick="toggleTheme()" class="w-full flex items-center justify-center lg:justify-start text-slate-400 font-black text-[10px] uppercase tracking-widest hover:opacity-80">
                <i class="theme-toggle-icon fas fa-moon w-5"></i> <span id="theme-text" class="hidden lg:block ml-2">Escuro</span>

        function initApp() {
            loadLocalData();
            const daysMap = { 0: "Segunda", 1: "Segunda", 2: "Terça", 3: "Quarta", 4: "Quinta", 5: "Sexta", 6: "Segunda" };
            const today = daysMap[new Date().getDay()];
            renderScheduleByDay(today);
            updateHeaderInfo();
            checkTheme();
            setInterval(updateHeaderInfo, 1000);
            renderRadar();
        }

        function loadLocalData() {
            tasks = JSON.parse(localStorage.getItem('camb3_tasks') || '[]');
            schedules = JSON.parse(localStorage.getItem('camb3_schedules') || '{"T1":null,"T2":null}');
            updateCurrentStructure();
        }

        function saveLocalData() {
            localStorage.setItem('camb3_tasks', JSON.stringify(tasks));
            localStorage.setItem('camb3_schedules', JSON.stringify(schedules));
        }

        function updateCurrentStructure() {
            structure = schedules[currentTurma] || getDefaultStructure(currentTurma);
            populateSubjectSelect();
        }

        function populateSubjectSelect() {
            const subjects = [...new Set(Object.values(structure).flat().map(i => i.subject))].filter(s => s !== "Vago" && s !== "Intervalo").sort();
            const sel = document.getElementById('tSubject');
            if(sel) sel.innerHTML = subjects.map(s => `<option value="${s}">${s.length > 30 ? s.substring(0,30)+'...' : s}</option>`).join('');
        }

        function setTab(tab) {
            ['view-schedule', 'view-tasks', 'view-calendar'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            // Desktop Nav
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-brand-500', 'text-white', 'shadow-lg');
                b.classList.add('text-slate-400');
                if(b.getAttribute('data-tab') === tab) {
                    b.classList.add('bg-brand-500', 'text-white', 'shadow-lg');
                    b.classList.remove('text-slate-400');
                }
            });

            // Mobile Nav
            document.querySelectorAll('.mobile-btn').forEach(b => {
                b.classList.remove('text-brand-500');
                b.classList.add('text-slate-400');
                if(b.getAttribute('data-tab') === tab) {
                    b.classList.add('text-brand-500');
                    b.classList.remove('text-slate-400');
                }
            });

            if(tab === 'schedule') {
                renderScheduleByDay(activeDayTab || 'Segunda');
                renderRadar();
            }
            if(tab === 'tasks') renderTasks();
            if(tab === 'calendar') renderCalendar();
        }

        function renderScheduleByDay(day) {
            activeDayTab = day;
            const container = document.getElementById('day-schedule-container');
            
            document.querySelectorAll('.day-tab').forEach(t => {
                t.classList.remove('active');
                if(t.getAttribute('data-day') === day) t.classList.add('active');
            });

            const dayLessons = structure[day];
            let html = '';

            dayLessons.forEach(lesson => {
                const isLive = isCurrentLesson(day, lesson.start, lesson.end);
                const isVago = lesson.subject === "Vago" || lesson.subject === "Intervalo";
                
                if (isLive) document.getElementById('current-lesson-name').innerText = lesson.subject;

                html += `
                    <div onclick="showSubjectTasks('${lesson.subject.replace(/'/g, "\\'")}')" 
                         class="schedule-card glass-panel p-6 rounded-[2rem] cursor-pointer group hover:-translate-y-2 ${isLive ? 'active-glow' : ''} ${isVago ? 'opacity-60 grayscale' : ''}">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 flex items-center justify-center shadow-sm">
                                <i class="${getIconForSubject(lesson.subject)} text-xl ${isLive ? 'text-brand-500' : 'text-slate-400'}"></i>
                            </div>
                            <span class="text-[10px] font-black px-3 py-1 rounded-full ${isLive ? 'bg-white/20 text-white' : 'bg-brand-500/10 text-brand-500'}">
                                ${lesson.start} — ${lesson.end}
                            </span>
                        </div>
                        <h4 class="font-display font-bold text-lg leading-tight ${isLive ? 'text-white' : 'text-slate-800 dark:text-white'}">
                            ${lesson.subject}
                        </h4>
                        <div class="mt-4 pt-4 border-t border-slate-100/10 flex justify-between items-center">
                             <span class="text-[10px] font-bold uppercase tracking-widest ${isLive ? 'text-white/60' : 'text-slate-400'}">
                                ${isLive ? 'Aula em andamento' : 'Cronograma'}
                             </span>
                             <i class="fas fa-chevron-right text-[10px] ${isLive ? 'text-white' : 'text-slate-300'}"></i>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderRadar() {
            const container = document.getElementById('radar-container');
            const section = document.getElementById('radar-section');
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const limit = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const upcoming = tasks.filter(t => {
                if (t.done) return false;
                const taskDate = new Date(t.date + 'T00:00:00');
                if (taskDate < today) return false; 
                return taskDate <= limit;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            if (!upcoming.length) { 
                section.classList.add('hidden'); 
                return; 
            }
            
            section.classList.remove('hidden');
            
            container.innerHTML = upcoming.map(t => {
                const taskDate = new Date(t.date + 'T00:00:00');
                const diffTime = taskDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let diffText = diffDays + ' dias';
                let diffClass = 'text-slate-400';
                let glowClass = '';
                
                if (diffDays === 0) {
                    diffText = 'HOJE';
                    diffClass = 'text-rose-500 font-black animate-pulse';
                    glowClass = 'border border-rose-500/30 shadow-[0_0_15px_rgba(244,63,94,0.15)]';
                } else if (diffDays === 1) {
                    diffText = 'AMANHÃ';
                    diffClass = 'text-amber-500 font-bold';
                }

                const colorClass = getSubjectColor(t.subject);

                return `
                    <div onclick="showSubjectTasks('${t.subject.replace(/'/g, "\\'")}')" class="min-w-[260px] snap-center glass-panel p-5 rounded-[2rem] cursor-pointer hover:-translate-y-2 transition-all duration-300 group ${glowClass}">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full ${colorClass}">${t.subject.length > 20 ? t.subject.substring(0,20)+'...' : t.subject}</span>
                            <span class="text-[10px] font-black uppercase tracking-widest ${diffClass}">${diffText}</span>
                        </div>
                        <h6 class="font-bold text-sm leading-snug text-slate-800 dark:text-slate-200 group-hover:text-brand-500 transition-colors">${t.text}</h6>
                    </div>`;
            }).join('');
        }

        function renderTasks() {
            const pList = document.getElementById('list-pending');
            const cList = document.getElementById('list-completed');
            
            const today = new Date(); 
            today.setHours(0,0,0,0);

            const pending = tasks.filter(t => {
                if (t.done) return false;
                const d = new Date(t.date + 'T00:00:00');
                return d >= today; 
            }).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            const done = tasks.filter(t => {
                if (!t.done) return false;
                const d = new Date(t.date + 'T00:00:00');
                return d >= today;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            // Atualiza a Barra de Progresso
            const totalTasksCount = pending.length + done.length;
            const progressPercentage = totalTasksCount === 0 ? 0 : Math.round((done.length / totalTasksCount) * 100);

            const progressBar = document.getElementById('task-progress-bar');
            const progressText = document.getElementById('task-progress-text');
            if (progressBar && progressText) {
                progressBar.style.width = `${progressPercentage}%`;
                progressText.innerText = `${progressPercentage}%`;
            }

            const buildHtml = (t) => {
                const colorClass = getSubjectColor(t.subject);
                return `
                <div class="glass-panel p-5 rounded-3xl flex items-center gap-4 group">
                    <button onclick="toggleTask('${t.id}')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-brand-500 text-transparent'}"><i class="fas fa-check text-[10px]"></i></button>
                    <div class="flex-1 min-w-0">
                        <span class="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full ${colorClass}">${t.subject.length > 25 ? t.subject.substring(0,25)+'...' : t.subject}</span>
                        <p class="font-bold text-sm truncate mt-1.5 ${t.done ? 'line-through opacity-50' : 'text-slate-800 dark:text-white'}">${t.text}</p>
                        <p class="text-[10px] text-slate-400 font-medium mt-0.5"><i class="far fa-calendar mr-1"></i>${new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR')}</p>
                    </div>
                    <button onclick="confirmDeleteTask('${t.id}')" class="text-rose-400 hover:bg-rose-500/10 p-3 rounded-xl opacity-100 md:opacity-0 group-hover:opacity-100 transition-all"><i class="fas fa-trash"></i></button>
                </div>`;
            };

            pList.innerHTML = pending.length ? pending.map(buildHtml).join('') : '<div class="col-span-2 text-center py-8"><p class="text-slate-400 font-bold">Tudo limpo por aqui! 🎉</p></div>';
            cList.innerHTML = done.length ? done.map(buildHtml).join('') : '';
        }

        function handleAddTask() {
            const subj = document.getElementById('tSubject').value;
            const input = document.getElementById('tInput');
            const date = document.getElementById('tDate');

            if(!input.value || !date.value) {
                showToast("Preencha todos os campos");
                return;
            }
            tasks.push({
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                subject: subj, text: input.value, date: date.value, done: false
            });
            saveLocalData();
            input.value = '';
            showToast("Tarefa adicionada!");
            renderTasks();
            renderCalendar();
            renderRadar();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveLocalData();
                renderTasks();
                renderCalendar();
                renderRadar();
                const modalTitle = document.getElementById('modal-title').innerText;
                if (modalTitle === task.subject) showSubjectTasks(task.subject);
                else if (modalTitle.startsWith('Tarefas:')) {
                    const datePart = modalTitle.replace('Tarefas: ', '');
                    const [d, m, y] = datePart.split('/');
                    showDayTasks(`${y}-${m}-${d}`);
                }
            }
        }

        function confirmDeleteTask(id) {
            lastModalContext = document.getElementById('modal-title').innerText;
            document.getElementById('modal-title').innerText = "Excluir Tarefa";
            document.getElementById('modal-body').innerHTML = `
                <div class="text-center py-4">
                    <div class="w-16 h-16 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fas fa-trash-alt"></i></div>
                    <h3 class="font-bold text-lg mb-2 text-slate-800 dark:text-white">Tem certeza?</h3>
                    <p class="text-slate-500 mb-6 text-sm">Esta ação removerá a tarefa do dispositivo.</p>
                    <div class="flex gap-3 justify-center">
                        <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Cancelar</button>
                        <button onclick="executeDeleteTask('${id}')" class="px-5 py-2.5 rounded-xl font-bold bg-rose-500 text-white">Excluir</button>
                    </div>
                </div>`;
            openModal();
        }

        function executeDeleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveLocalData();
            closeModal();
            showToast("Tarefa apagada.");
            renderTasks();
            renderCalendar();
            renderRadar();
            
            setTimeout(() => {
                if (allAvailableSubjects.includes(lastModalContext)) showSubjectTasks(lastModalContext);
                else if (lastModalContext.startsWith('Tarefas:')) {
                    const datePart = lastModalContext.replace('Tarefas: ', '');
                    const [d, m, y] = datePart.split('/');
                    showDayTasks(`${y}-${m}-${d}`);
                }
            }, 350);
        }

        function showDayTasks(dateStr) {
            const todayForDay = new Date();
            todayForDay.setHours(0,0,0,0);
            
            const dayTasks = tasks.filter(t => {
                if (t.date !== dateStr) return false;
                const taskDate = new Date(t.date + 'T00:00:00');
                return taskDate >= todayForDay;
            });
            
            const [y, m, d] = dateStr.split('-');
            const formattedDate = `${d}/${m}/${y}`;
            
            document.getElementById('modal-title').innerText = `Tarefas: ${formattedDate}`;
            
            if(dayTasks.length === 0) {
                document.getElementById('modal-body').innerHTML = `
                    <div class="text-center py-8">
                        <div class="w-16 h-16 bg-brand-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 text-brand-500 text-2xl"><i class="fas fa-calendar-check"></i></div>
                        <p class="text-slate-500 font-medium">Nenhuma tarefa pendente para este dia.</p>
                        <button onclick="setTab('tasks'); closeModal(); setTimeout(() => document.getElementById('tDate').value = '${dateStr}', 100);" class="mt-4 px-6 py-3 glass-panel text-brand-500 hover:bg-brand-500 hover:text-white rounded-2xl font-bold text-sm transition-all"><i class="fas fa-plus mr-1"></i> Adicionar Tarefa</button>
                    </div>`;
            } else {
                document.getElementById('modal-body').innerHTML = `
                    <div class="space-y-3">
                        ${dayTasks.map(t => {
                            const colorClass = getSubjectColor(t.subject);
                            return `
                            <div class="flex items-center gap-3 glass-panel p-4 rounded-2xl group">
                                <button onclick="toggleTask('${t.id}')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
                                    t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-brand-500 text-transparent'
                                }"><i class="fas fa-check text-[10px]"></i></button>
                                
                                <div class="flex-1 min-w-0 flex flex-col">
                                    <span class="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full w-fit mb-1 ${colorClass}">${t.subject.length > 25 ? t.subject.substring(0,25)+'...' : t.subject}</span>
                                    <span class="text-sm font-bold text-slate-800 dark:text-slate-200 ${t.done ? 'line-through opacity-50' : ''}">${t.text}</span>
                                </div>
                                
                                <button onclick="confirmDeleteTask('${t.id}')" class="text-rose-400 hover:bg-rose-500/10 p-3 rounded-xl transition-all flex-shrink-0 opacity-100 md:opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i></button>
                            </div>
                            `
                        }).join('')}
                    </div>
                    
                    <div class="mt-8 flex justify-center">
                        <button onclick="setTab('tasks'); closeModal(); setTimeout(() => document.getElementById('tDate').value = '${dateStr}', 100);" class="text-xs uppercase tracking-widest font-bold text-brand-500 hover:text-brand-600 transition-colors">
                            <i class="fas fa-plus mr-1"></i> Adicionar nova tarefa neste dia
                        </button>
                    </div>`;
            }
            openModal();
        }

        function showSubjectTasks(sub) {
            if(sub === "Vago" || sub === "Intervalo") return;
            document.getElementById('modal-title').innerText = sub;
            
            const todayForSub = new Date();
            todayForSub.setHours(0,0,0,0);
            
            const st = tasks.filter(t => {
                if (t.subject !== sub) return false;
                const taskDate = new Date(t.date + 'T00:00:00');
                return taskDate >= todayForSub;
            });
            
            let html = '<div class="space-y-3">';
            if(st.length === 0) html += '<p class="text-slate-400 text-center py-4">Nenhuma tarefa pendente para esta matéria.</p>';
            st.forEach(t => {
                html += `<div class="flex items-center gap-3 glass-panel p-3 rounded-xl">
                    <button onclick="toggleTask('${t.id}')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent'}"><i class="fas fa-check text-[10px]"></i></button>
                    <span class="text-sm font-bold flex-1 text-slate-800 dark:text-slate-200 ${t.done?'line-through opacity-50':''}">${t.text}</span>
                    <span class="text-xs font-medium text-slate-400">${new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR').slice(0,5)}</span>
                    <button onclick="confirmDeleteTask('${t.id}')" class="text-rose-400 hover:bg-rose-500/10 p-2 rounded-lg transition-all"><i class="fas fa-trash"></i></button>
                </div>`;
            });
            html += `</div><div class="mt-6 flex justify-center"><button onclick="setTab('tasks'); closeModal(); document.getElementById('tSubject').value='${sub}';" class="text-[11px] font-bold text-brand-500 uppercase tracking-widest"><i class="fas fa-plus mr-1"></i> Nova Tarefa Aqui</button></div>`;
            document.getElementById('modal-body').innerHTML = html;
            openModal();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            let html = '';

            calendarData2026.forEach(monthData => {
                const year = 2026;
                const month = monthData.monthIdx;
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();

                let gridHtml = '';
                for(let i = 0; i < firstDay; i++) gridHtml += `<div></div>`;

                for(let day = 1; day <= daysInMonth; day++) {
                    const type = getDayType(monthData.events, day);
                    let classes = getDayTypeClass(type);
                    
                    const mStr = String(month + 1).padStart(2, '0');
                    const dStr = String(day).padStart(2, '0');
                    const dateStr = `${year}-${mStr}-${dStr}`;
                    
                    const todayForCal = new Date();
                    todayForCal.setHours(0,0,0,0);
                    const dayTasks = tasks.filter(t => {
                        if (t.date !== dateStr) return false;
                        const taskDate = new Date(t.date + 'T00:00:00');
                        return taskDate >= todayForCal;
                    });
                    
                    let indicator = '';

                    if (dayTasks.length > 0) {
                        const pendingCount = dayTasks.filter(t => !t.done).length;
                        classes = classes.replace('bg-slate-200', '').replace('dark:bg-slate-700', '').replace('text-slate-600', '').replace('dark:text-slate-400', '');
                        classes += ' active-glow cursor-pointer hover:scale-110 transition-transform text-white font-bold border-none shadow-lg';
                        
                        if (pendingCount > 0) {
                            indicator = `<span class="absolute -top-1 -right-1 w-3 h-3 bg-brand-400 rounded-full border-2 border-white dark:border-slate-800 animate-pulse shadow-[0_0_10px_#818cf8]"></span>`;
                        } else {
                            indicator = `<span class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-400 rounded-full border-2 border-white dark:border-slate-800"></span>`;
                        }
                    } else {
                        classes += ' cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition-all';
                    }

                    gridHtml += `<div onclick="showDayTasks('${dateStr}')" class="relative w-6 h-6 md:w-8 md:h-8 mx-auto flex items-center justify-center rounded-xl text-xs ${classes}">${day}${indicator}</div>`;
                }

                const legendHtml = monthData.legend.map(l => `
                    <li class="flex items-center gap-2 text-[10px] text-slate-500 font-medium">
                        <i class="fas fa-circle text-[6px] ${l.color}"></i> ${l.text}
                    </li>
                `).join('');

                html += `
                    <div class="glass-panel rounded-3xl p-6 flex flex-col h-full">
                        <h4 class="font-display font-bold text-lg mb-4 text-center">${monthData.name}</h4>
                        <div class="grid grid-cols-7 gap-y-2 gap-x-1 text-center mb-4">
                            <div class="font-black text-[10px] text-slate-400">D</div>
                            <div class="font-black text-[10px] text-slate-400">S</div>
                            <div class="font-black text-[10px] text-slate-400">T</div>
                            <div class="font-black text-[10px] text-slate-400">Q</div>
                            <div class="font-black text-[10px] text-slate-400">Q</div>
                            <div class="font-black text-[10px] text-slate-400">S</div>
                            <div class="font-black text-[10px] text-slate-400">S</div>
                            ${gridHtml}
                        </div>
                        <ul class="space-y-1 mt-auto pt-4 border-t border-slate-100 dark:border-slate-800/50">
                            ${legendHtml}
                        </ul>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function getDayTypeClass(type) {
            switch(type) {
                case 'holiday': return 'bg-rose-500 text-white font-bold shadow-md';
                case 'recess': return 'bg-amber-400 text-amber-900 font-bold shadow-md';
                case 'academic': return 'bg-brand-500 text-white font-bold shadow-md';
                case 'important': return 'bg-emerald-500 text-white font-bold shadow-md';
                case 'exam': return 'bg-indigo-500 text-white font-bold shadow-md';
                case 'default': return 'bg-slate-200 dark:bg-slate-700 font-bold';
                default: return 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer';
            }
        }

        function getDayType(monthEvents, day) {
            for (let ev of monthEvents) {
                if (ev.days.includes(day)) return ev.type;
            }
            return '';
        }

        function openBackupModal() {

                <div class="space-y-6">
                    <div class="glass-panel p-5 rounded-[2rem]">
                        <div class="flex items-center gap-3 mb-3">

                                <h4 class="font-bold text-sm text-slate-800 dark:text-white">Exportar Dados</h4>

                    <div class="glass-panel p-5 rounded-[2rem]">

        function copyBackupCode() {
            const input = document.getElementById('backup-code');
            input.select();
            document.execCommand('copy');
            showToast("Código copiado!");
        }

        function restoreBackupCode() {
            try {
                const data = JSON.parse(decodeURIComponent(atob(document.getElementById('restore-code').value)));
                if(data.tasks && data.schedules) {
                    tasks = data.tasks; 
                    schedules = data.schedules;
                    saveLocalData(); 
                    updateCurrentStructure();
                    renderScheduleByDay(activeDayTab); 
                    renderTasks(); 
                    renderCalendar();
                    renderRadar();
                    closeModal(); 
                    showToast("Dados restaurados com sucesso!");
                }
            } catch(e) {
                showToast("Código inválido ou incompleto.");
            }
        }

        function openEditSchedule() {
            let html = `<div class="space-y-4 max-h-[50vh] overflow-y-auto custom-scroll pr-2 pb-6">`;
            const days = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];
            
            days.forEach(day => {
                html += `<div class="glass-panel p-5 rounded-[2rem]"><h4 class="font-bold text-brand-500 mb-4">${day}</h4><div class="space-y-3">`;
                structure[day].forEach((slot, idx) => {
                    if(slot.subject === "Intervalo") return;
                    html += `<div class="flex items-center gap-3">
                        <span class="text-[10px] font-black tracking-widest text-slate-400 w-16 text-center">${slot.start}</span>
                        <select id="edit-${day}-${idx}" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs font-bold outline-none focus:border-brand-500 text-slate-700 dark:text-slate-300">
                            ${allAvailableSubjects.map(s => `<option value="${s}" ${slot.subject===s?'selected':''}>${s.length > 30 ? s.substring(0,30)+'...' : s}</option>`).join('')}
                        </select>
                    </div>`;
                });
                html += `</div></div>`;
            });
            
            html += `</div><button onclick="saveSchedule()" class="w-full mt-4 bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all">Salvar Grade ${currentTurma}</button>`;
            document.getElementById('modal-title').innerText = "Editar Horários";
            document.getElementById('modal-body').innerHTML = html;
            openModal();
        }

        function saveSchedule() {
            const newSchedule = JSON.parse(JSON.stringify(structure));
            ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"].forEach(day => {
                newSchedule[day].forEach((slot, idx) => {
                    if(slot.subject === "Intervalo") return;
                    const el = document.getElementById(`edit-${day}-${idx}`);
                    if(el) slot.subject = el.value;
                });
            });
            schedules[currentTurma] = newSchedule;
            structure = newSchedule;
            saveLocalData();
            populateSubjectSelect();
            renderScheduleByDay(activeDayTab);
            closeModal();
            showToast("Grade salva e atualizada!");
        }

        function toggleTheme() {
            const icons = document.querySelectorAll('.theme-toggle-icon');
            icons.forEach(icon => icon.classList.add('theme-spin'));
            setTimeout(() => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeIcon(isDark);
                setTimeout(() => icons.forEach(icon => icon.classList.remove('theme-spin')), 500);
            }, 250);
        }

        function checkTheme() { 
            const isDark = localStorage.getItem('theme') === 'dark';
            if(isDark) document.documentElement.classList.add('dark');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icons = document.querySelectorAll('.theme-toggle-icon');
            const text = document.getElementById('theme-text');
            icons.forEach(icon => {
                if(isDark) icon.className = "theme-toggle-icon fas fa-sun text-amber-400 theme-spin";
                else icon.className = "theme-toggle-icon fas fa-moon text-slate-500 theme-spin";
            });
            if(text) text.innerText = isDark ? "Claro" : "Escuro";
        }

        function isCurrentLesson(day, startStr, endStr) {
            const now = new Date();
            const daysMap = { 0: "Domingo", 1: "Segunda", 2: "Terça", 3: "Quarta", 4: "Quinta", 5: "Sexta", 6: "Sábado" };
            if (daysMap[now.getDay()] !== day) return false;
            const [sh, sm] = startStr.split(':').map(Number);
            const [eh, em] = endStr.split(':').map(Number);
            const s = new Date(); s.setHours(sh, sm, 0);
            const e = new Date(); e.setHours(eh, em, 0);
            return now >= s && now <= e;
        }

        function getIconForSubject(sub) {
            const s = sub.toLowerCase();
            if(s.includes('mat')) return 'fas fa-calculator';
            if(s.includes('fís')) return 'fas fa-atom';
            if(s.includes('quí')) return 'fas fa-flask';
            if(s.includes('red') || s.includes('lit')) return 'fas fa-pen-nib';
            if(s.includes('ing') || s.includes('líng')) return 'fas fa-language';
            if(s.includes('bio') || s.includes('tox')) return 'fas fa-biohazard';
            if(s.includes('amb') || s.includes('leaf') || s.includes('efluentes')) return 'fas fa-leaf';
            if(s.includes('soc')) return 'fas fa-users';
            if(s.includes('his')) return 'fas fa-landmark';
            if(s.includes('análises') || s.includes('microbiologia')) return 'fas fa-microscope';
            if(s.includes('vago')) return 'fas fa-mug-hot';
            if(s.includes('inter')) return 'fas fa-utensils';
            return 'fas fa-book';
        }

        function showToast(msg) {
            const t = document.createElement('div');

            t.innerHTML = `<i class="fas fa-check-circle text-brand-500"></i> <span class="text-xs font-bold text-slate-800 dark:text-white">${msg}</span>`;
            document.getElementById('toast-container').appendChild(t);

        function openModal() {
            const o = document.getElementById('modal-overlay');
            const b = document.getElementById('modal-box');
            o.classList.remove('hidden'); void o.offsetWidth;
            o.classList.add('opacity-100'); b.classList.add('scale-100');
        }
        
        function closeModal() {
            const o = document.getElementById('modal-overlay');
            const b = document.getElementById('modal-box');
            o.classList.remove('opacity-100');
            b.classList.remove('scale-100');
            setTimeout(() => {
                o.classList.add('hidden');
                b.classList.remove('md:max-w-5xl');
                b.classList.add('max-w-lg');
            }, 300);
        }

        function showAllTasksTable() {
            const today = new Date();
            today.setHours(0,0,0,0);

            const upcomingTasks = tasks.filter(t => {
                if (t.done) return false;
                const taskDate = new Date(t.date + 'T00:00:00');
                return taskDate >= today;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            const groupedTasks = {};
            upcomingTasks.forEach(t => {
                if (!groupedTasks[t.date]) groupedTasks[t.date] = [];
                groupedTasks[t.date].push(t);
            });

            let html = '<div class="glass-panel bg-white/95 dark:bg-slate-900/90 rounded-[2rem] shadow-2xl border border-white/60 dark:border-slate-700/50 backdrop-blur-xl overflow-x-auto custom-scroll max-h-[60vh] p-2">';
            html += '<table class="w-full text-left border-collapse">';
            html += '<thead><tr class="border-b border-slate-200 dark:border-slate-700"><th class="py-4 px-5 font-bold text-slate-800 dark:text-slate-200">Data</th><th class="py-4 px-5 font-bold text-slate-800 dark:text-slate-200">Matérias</th><th class="py-4 px-5 font-bold text-slate-800 dark:text-slate-200">Trabalhos</th></tr></thead><tbody>';
            
            const sortedDates = Object.keys(groupedTasks).sort();

            if(sortedDates.length === 0) {
                html += '<tr><td colspan="3" class="py-10 text-center text-slate-500 font-medium">Nenhum trabalho pendente! 🎉</td></tr>';
            } else {
                sortedDates.forEach(date => {
                    const dayTasks = groupedTasks[date];
                    const dateObj = new Date(date + 'T00:00:00');
                    const dateStr = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                    
                    const subjectsHtml = dayTasks.map(t => `<div class="mb-3 last:mb-0"><span class="text-[9px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full ${getSubjectColor(t.subject)}">${t.subject}</span></div>`).join('');
                    
                    const tasksHtml = dayTasks.map((t, idx) => `<div class="mb-3 last:mb-0 flex items-start gap-2.5"><span class="w-5 h-5 rounded-full bg-brand-500/10 text-brand-500 flex items-center justify-center text-[10px] font-black shrink-0 mt-0.5">${idx + 1}</span><span class="text-sm font-medium text-slate-700 dark:text-slate-300 leading-snug">${t.text}</span></div>`).join('<div class="h-px w-full bg-slate-200/50 dark:bg-slate-700/50 my-3"></div>');

                    html += `<tr class="border-b border-slate-100 dark:border-slate-800/50 hover:bg-slate-50/80 dark:hover:bg-slate-800/80 transition-colors">
                        <td class="py-5 px-5 text-xs font-bold text-slate-600 dark:text-slate-400 whitespace-nowrap align-top pt-6"><i class="far fa-calendar-alt mr-1 text-brand-500"></i> ${dateStr}</td>
                        <td class="py-5 px-5 align-top pt-6">${subjectsHtml}</td>
                        <td class="py-5 px-5 align-top pt-5">${tasksHtml}</td>
                    </tr>`;
                });
            }
            html += '</tbody></table></div>';
            
            document.getElementById('modal-title').innerText = "Todas as Tarefas";
            document.getElementById('modal-body').innerHTML = html;
            
            const b = document.getElementById('modal-box');
            b.classList.remove('max-w-lg');
            b.classList.add('md:max-w-5xl');

            openModal();
        }
